name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One cloud demo DB, so one run at a time. A running workflow is never
# canceled mid-cleanup; GitHub keeps at most one run pending behind it, and a
# newer push replaces that pending run before it has touched the database.
concurrency:
  group: ruaha-demo-database
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_DATA_MODE: demo
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require demo fixture credentials
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_DB_HOST"
          test -n "$SUPABASE_DB_USER"
          test -n "$SUPABASE_DB_PASSWORD"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Record migration history
        run: pnpm db:list
      - name: Run browser suite
        run: pnpm e2e --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/e2e.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-proof-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30

  rls:
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: ${{ always() && needs.check.result == 'success' }}
    env:
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require demo DB credentials
        run: |
          test -n "$SUPABASE_DB_HOST"
          test -n "$SUPABASE_DB_USER"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Migration state
        run: pnpm db:list
      - name: RLS assertions
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          CONN="host=$SUPABASE_DB_HOST port=${SUPABASE_DB_PORT:-5432} dbname=postgres user=$SUPABASE_DB_USER sslmode=require"
          psql "$CONN" -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql 2>&1 | tee rls-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-proof-${{ github.sha }}
          path: rls-proof.log
          if-no-files-found: warn
          retention-days: 30
